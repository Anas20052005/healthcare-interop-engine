server:
  port: 8080

spring:
  application:
    name: healthcare-interop-engine
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:application-local.yml
      - optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hl7_fhir_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://healthcare-interop-engine-frontend.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost,http://localhost:80}

app:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  seed-mock-destination: ${SEED_MOCK_DESTINATION:true}
  admin:
    seed: ${SEED_ADMIN_USER:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  retry:
    enabled: ${RETRY_ENABLED:true}
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RETRY_INITIAL_INTERVAL_MS:2000}
    multiplier: ${RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${RETRY_MAX_INTERVAL_MS:60000}
    jitter: ${RETRY_JITTER:0.2}
    poll-interval-ms: ${RETRY_POLL_INTERVAL_MS:5000}

