server:
  port: 8080
  tomcat:
    connection-timeout: 60000

spring:
  application:
    name: healthcare-interop-engine
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:application-local.yml
      - optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hl7_fhir_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HealthcareHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://healthcare-interop-engine-frontend.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost,http://localhost:80}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://healthcare-interop-engine-frontend*.vercel.app,https://healthcare-interop-*.vercel.app}

app:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  seed-mock-destination: ${SEED_MOCK_DESTINATION:true}
  admin:
    seed: ${SEED_ADMIN_USER:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  demo:
    seed: ${SEED_DEMO_USER:true}
    username: ${DEMO_USERNAME:demo_recruiter}
    password: ${DEMO_PASSWORD:}
    hospital-name: ${DEMO_HOSPITAL_NAME:Recruiter Demo Hospital}
    hospital-code: ${DEMO_HOSPITAL_CODE:DEMO-REC}
  retry:
    enabled: ${RETRY_ENABLED:true}
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RETRY_INITIAL_INTERVAL_MS:2000}
    multiplier: ${RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${RETRY_MAX_INTERVAL_MS:60000}
    jitter: ${RETRY_JITTER:0.2}
    poll-interval-ms: ${RETRY_POLL_INTERVAL_MS:5000}
